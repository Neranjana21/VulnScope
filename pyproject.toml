[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "vulnscope"
version = "0.1.0"
description = "Authorization-first vulnerability assessment platform (Slice 0: the spine)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "VulnScope" }]

dependencies = [
    "fastapi==0.115.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.36",
    "alembic==1.13.3",
    "asyncpg==0.30.0",
    "cryptography==43.0.3",
    "httpx==0.27.2",
    "python-multipart==0.0.12",
    "uvicorn==0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "hypothesis==6.115.5",
    "ruff==0.7.4",
    "mypy==1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vulnscope"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running Postgres instance (skips cleanly without one)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["vulnscope.policy.*", "vulnscope.ledger.*"]
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
