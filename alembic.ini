[alembic]
script_location = alembic

# No credential lives here. env.py overwrites this at invocation time from
# the VULNSCOPE_MIGRATION_DATABASE_URL environment variable (the
# vulnscope_migrator role), never from this file -- see
# docs/gates/slice0-plan.md Section 3.8.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
